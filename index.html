<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шкільний монітор 4-А</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f0f9 url('https://raw.githubusercontent.com/vmorozz248/school-monitor/main/background.png') no-repeat center center fixed; background-size: cover; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 10px; }
        .card { background: rgba(255, 255, 255, 0.98); padding: 20px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); width: 100%; max-width: 450px; position: relative; }
        
        .tab-menu { display: flex; gap: 5px; margin-bottom: 20px; border-bottom: 2px solid #e9dcf5; justify-content: space-around; }
        .tab { padding: 10px 5px; cursor: pointer; font-weight: bold; color: #8352b2; font-size: 14px; flex: 1; text-align: center; }
        .tab.active { color: #61309e; border-bottom: 3px solid #61309e; }
        
        .sub-tab-menu { display: flex; justify-content: center; gap: 5px; margin-bottom: 15px; background: #f3ebf9; padding: 5px; border-radius: 12px; }
        .sub-tab { padding: 8px 15px; cursor: pointer; font-size: 13px; border-radius: 10px; font-weight: bold; color: #61309e; }
        .sub-tab.active { background: #61309e; color: white; }

        /* СПИСОК УЧНІВ У ВКЛАДЦІ "ДОДАТИ" */
        .scroll-box { background: white; border: 2px solid #e9dcf5; border-radius: 15px; padding: 5px; max-height: 250px; overflow-y: auto; margin-bottom: 15px; }
        .student-select-row { display: flex; align-items: center; padding: 12px; border-bottom: 1px solid #f9f4fd; cursor: pointer; width: 100%; }
        .student-select-row:last-child { border-bottom: none; }
        .student-select-row input { width: 20px; height: 20px; margin-right: 15px; accent-color: #61309e; cursor: pointer; flex-shrink: 0; }
        .student-select-row span { font-size: 15px; color: #4b1681; font-weight: 500; }

        /* КАРТКИ У ЖУРНАЛІ (ПРЕДМЕТИ) */
        .card-sub { background: #fdfaff; border: 1px solid #eee; padding: 12px; border-radius: 15px; margin-bottom: 12px; text-align: left; }
        .debtor-container { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
        .debtor-tag { display: inline-block; background: #e9dcf5; color: #61309e; padding: 4px 10px; border-radius: 10px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .debtor-tag:hover { background: #e74c3c; color: white; }

        /* КАРТКИ У ЖУРНАЛІ (УЧНІ) */
        .card-stud { background: white; border: 1px solid #f0e6f7; border-left: 5px solid #61309e; padding: 10px; border-radius: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .group-header { background: #fff; border: 1px solid #e9dcf5; padding: 12px; border-radius: 15px; margin-bottom: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: #61309e; font-weight: bold; }

        /* ЗАГАЛЬНІ СТИЛІ */
        .cat-tag { font-size: 9px; font-weight: bold; text-transform: uppercase; padding: 2px 6px; border-radius: 5px; color: white; display: inline-block; margin-bottom: 5px; }
        .tag-diag { background: #e74c3c; } .tag-creat { background: #27ae60; } .tag-poem { background: #2980b9; } .tag-other { background: #8e44ad; }
        .date-badge { background: #f0e6f7; color: #61309e; padding: 2px 6px; border-radius: 6px; font-size: 11px; font-weight: bold; margin-right: 5px; }

        select, input[type="text"], input[type="number"], input[type="date"] { width: 100%; padding: 12px; border: 2px solid #e9dcf5; border-radius: 12px; font-size: 15px; margin-bottom: 12px; outline: none; background: white; }
        button { width: 100%; padding: 14px; background: #61309e; color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 16px; }
        .report-btn { color: #27ae60; cursor: pointer; font-size: 18px; margin-left: 10px; vertical-align: middle; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="color: #1a012b; text-align: center; margin: 0 0 20px 0;">Шкільний монітор</h2>

    <div id="adminPanel" class="hidden">
        <div class="tab-menu">
            <div class="tab active" onclick="showTab(1)">➕ Додати</div>
            <div class="tab" onclick="showTab(2)">📓 Журнал</div>
            <div class="tab" onclick="showTab(3)">📊 План</div>
        </div>
        
        <div id="view1">
            <div class="scroll-box" id="chkArea"></div>
            <select id="subSel"><option value="">-- Предмет --</option></select>
            <input type="date" id="dateInp">
            <input type="text" id="taskInp" placeholder="Назва роботи">
            <button onclick="sendDebt()">Розіслати борг</button>
        </div>

        <div id="view2" class="hidden">
            <div class="sub-tab-menu">
                <div id="st_s" class="sub-tab active" onclick="setJMode('s')">📚 Предмети</div>
                <div id="st_u" class="sub-tab" onclick="setJMode('u')">👤 Учні</div>
            </div>
            <div id="journalArea"></div>
        </div>

        <div id="view3" class="hidden">
            <div id="planList" style="max-height: 350px; overflow-y: auto;"></div>
            <button onclick="savePlans()" style="margin-top:10px;">Зберегти плани</button>
        </div>
    </div>

    <div id="loginForm">
        <select id="uSel" style="margin-bottom: 15px;"><option value="">-- Учень --</option></select>
        <input type="text" id="pInp" placeholder="Код">
        <button onclick="login()">Увійти</button>
    </div>

    <div id="resultView" class="hidden">
        <button onclick="location.reload()" style="width:auto; padding:5px 15px; margin-bottom:10px;">⬅ Назад</button>
        <h3 id="sNameTitle" style="text-align:center; color:#61309e;"></h3>
        <div id="debtListArea"></div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCaf5Zwl4mIxdReLgdoUCkzi1KWEMzeEpA",
        authDomain: "schoolmonitor-b1c8b.firebaseapp.com",
        databaseURL: "https://schoolmonitor-b1c8b-default-rtdb.firebaseio.com/",
        projectId: "schoolmonitor-b1c8b",
        storageBucket: "schoolmonitor-b1c8b.firebasestorage.app",
        messagingSenderId: "838073337449",
        appId: "1:838073337449:web:33a254365be4761b0544f8"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const students = {
        "id1": { name: "Астахова Є.", code: "26.12" }, "id2": { name: "Бабенко П.", code: "01.04" },
        "id3": { name: "Водолазька С.", code: "13.02" }, "id4": { name: "Гомонюк С.", code: "15.02" },
        "id5": { name: "Деміденко А.", code: "01.10" }, "id6": { name: "Єлісеєв Д.", code: "11.12" },
        "id7": { name: "Іванець Т.", code: "05.07" }, "id8": { name: "Калантаєва А.", code: "12.02" },
        "id9": { name: "Лисих Л.", code: "31.01" }, "id10": { name: "Оковитий М.", code: "17.06" },
        "id11": { name: "Павлов Т.", code: "26.04" }, "id12": { name: "Радченко В.", code: "25.04" },
        "id13": { name: "Скабардіна М.", code: "15.01" }, "id14": { name: "Удовіка М.", code: "27.10" },
        "id15": { name: "Філатова У.", code: "24.06" }, "id16": { name: "Холматова В.", code: "04.03" },
        "id17": { name: "Шаповал Т.", code: "04.05" }
    };

    const structure = {
        "Літературне читання": ["Діагностична робота", "Вірш", "Творча робота"],
        "Українська мова": ["Діагностична робота", "Інше"],
        "Математика": ["Діагностична робота", "Самостійна робота"],
        "Я досліджую світ": ["Діагностична робота", "Інше"],
        "Дизайн і технології": ["Творча робота"]
    };

    let jMode = 's';
    document.getElementById('dateInp').valueAsDate = new Date();

    const sortedIds = Object.keys(students).sort((a,b)=>students[a].name.localeCompare(students[b].name));
    const chkArea = document.getElementById('chkArea');
    const uSel = document.getElementById('uSel');
    const subSel = document.getElementById('subSel');
    const planList = document.getElementById('planList');

    sortedIds.forEach(id => {
        chkArea.innerHTML += `<div class="student-select-row" onclick="const i=this.querySelector('input');i.checked=!i.checked"><input type="checkbox" value="${id}" onclick="event.stopPropagation()"> <span>${students[id].name}</span></div>`;
        uSel.innerHTML += `<option value="${id}">${students[id].name}</option>`;
    });

    for(let s in structure) {
        structure[s].forEach(c => { subSel.innerHTML += `<option value="${s}|${c}">${s} - ${c}</option>`; });
        let pDiv = `<div style="background:#f4f0f9; padding:10px; border-radius:15px; margin-top:10px;"><b>📚 ${s}</b>`;
        structure[s].forEach(c => { pDiv += `<div style="display:flex; justify-content:space-between; margin-top:8px;">${c} <input type="number" id="p_${s}_${c}" style="width:55px; margin:0; padding:5px; text-align:center;"></div>`; });
        planList.innerHTML += pDiv + `</div>`;
    }

    function showTab(n) {
        document.getElementById('view1').classList.toggle('hidden', n !== 1);
        document.getElementById('view2').classList.toggle('hidden', n !== 2);
        document.getElementById('view3').classList.toggle('hidden', n !== 3);
        document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i+1 === n));
        if(n === 2) loadJournal();
        if(n === 3) loadPlans();
    }

    function loadJournal() {
        const area = document.getElementById('journalArea'); area.innerHTML = "Синхронізація...";
        db.ref('students').once('value', snap => {
            const data = snap.val() || {}; area.innerHTML = "";
            if(jMode === 's') {
                let subs = {};
                for(let sid in data) {
                    for(let s in data[sid]) {
                        for(let c in data[sid][s]) {
                            if(!structure[s] || !structure[s].includes(c)) continue;
                            for(let tid in data[sid][s][c]) {
                                const key = `${s}|${c}|${data[sid][s][c][tid].val}`;
                                if(!subs[key]) subs[key] = {s, c, val: data[sid][s][c][tid].val, list: []};
                                subs[key].list.push({sid, tid});
                            }
                        }
                    }
                }
                for(let k in subs) {
                    const item = subs[k];
                    const cls = item.c.includes('Діагностична')?'tag-diag':item.c.includes('Творча')?'tag-creat':'tag-poem';
                    area.innerHTML += `<div class="card-sub"><span class="cat-tag ${cls}">${item.s} - ${item.c}</span><br><b>${item.val}</b><div class="debtor-container">
                    ${item.list.map(l => `<span class="debtor-tag" onclick="del('${l.sid}','${item.s}','${item.c}','${l.tid}')">${students[l.sid].name.split(' ')[0]}</span>`).join('')}</div></div>`;
                }
            } else {
                sortedIds.forEach(sid => {
                    if(data[sid]) {
                        let h = `<div class="group-header" onclick="this.nextElementSibling.classList.toggle('hidden')"><span>👤 ${students[sid].name} <span class="report-btn" onclick="copyReport('${sid}', event)">📢</span></span></div><div class="hidden" style="padding: 0 5px;">`;
                        for(let s in data[sid]) {
                            for(let c in data[sid][s]) {
                                if(!structure[s] || !structure[s].includes(c)) continue;
                                for(let tid in data[sid][s][c]) { 
                                    const t = data[sid][s][c][tid];
                                    const bCls = c.includes('Діагностична')?'#e74c3c':c.includes('Творча')?'#27ae60':'#2980b9';
                                    h += `<div class="card-stud" style="border-left-color:${bCls}" onclick="del('${sid}','${s}','${c}','${tid}')">
                                            <div style="text-align:left;"><b>${s}</b><br><span class="date-badge">${t.date}</span><span style="font-size:12px; color:#61309e;">${t.val}</span></div>
                                            <div style="color:#ccc;">✕</div>
                                          </div>`; 
                                }
                            }
                        }
                        area.innerHTML += h + `</div>`;
                    }
                });
            }
        });
    }

    function del(sid, s, c, tid) { if(confirm(`Видалити цей борг?`)) db.ref(`students/${sid}/${s}/${c}/${tid}`).remove().then(() => loadJournal()); }
    function setJMode(m) { jMode = m; loadJournal(); document.getElementById('st_s').classList.toggle('active', m==='s'); document.getElementById('st_u').classList.toggle('active', m==='u'); }

    function login() {
        const id = document.getElementById('uSel').value, code = document.getElementById('pInp').value;
        if(code === "21.08") {
            document.getElementById('loginForm').classList.add('hidden');
            if(id) { document.getElementById('resultView').classList.remove('hidden'); loadData(id); }
            else { document.getElementById('adminPanel').classList.remove('hidden'); }
        } else if(id && students[id].code === code) {
            document.getElementById('loginForm').classList.add('hidden'); document.getElementById('resultView').classList.remove('hidden'); loadData(id);
        } else alert("Помилка доступу!");
    }

    function loadData(id) {
        document.getElementById('sNameTitle').innerText = students[id].name;
        db.ref('plans_v2').once('value', pSnap => {
            const plans = pSnap.val() || {};
            db.ref('students/'+id).on('value', snap => {
                const data = snap.val() || {}; const area = document.getElementById('debtListArea'); area.innerHTML = "";
                for(let s in structure) {
                    let sHtml = `<div class="card-stud" style="display:block; border-left:none; background:#fdfaff; cursor:default;"><h4>${s}</h4>`; let has = false;
                    structure[s].forEach(cat => {
                        const pVal = (plans[s] && plans[s][cat]) ? parseInt(plans[s][cat]) : 0;
                        if(pVal > 0) {
                            has = true; let dArr = []; if(data[s] && data[s][cat]) for(let k in data[s][cat]) dArr.push(data[s][cat][k]);
                            const cls = cat.includes('Діагностична')?'tag-diag':cat.includes('Творча')?'tag-creat':'tag-poem';
                            sHtml += `<span class="cat-tag ${cls}">${cat}</span><br><small>Виконано ${Math.max(0, pVal - dArr.length)} з ${pVal}</small>`;
                            dArr.forEach(d => { sHtml += `<div style="background:white; padding:8px; border-radius:10px; margin-top:5px; font-size:13px; border:1px solid #eee;">${d.date} — <b>${d.val}</b></div>`; });
                        }
                    });
                    if(has) area.innerHTML += sHtml + `</div>`;
                }
            });
        });
    }

    function sendDebt() {
        const ids = Array.from(document.querySelectorAll('#chkArea input:checked')).map(i => i.value);
        const subVal = document.getElementById('subSel').value;
        const task = document.getElementById('taskInp').value;
        const date = document.getElementById('dateInp').value;
        if(!task || ids.length === 0 || !subVal) return alert("Заповніть все!");
        const sub = subVal.split('|');
        ids.forEach(id => db.ref(`students/${id}/${sub[0]}/${sub[1]}`).push({val: task, date: date.split('-').reverse().join('.')}));
        alert("Окей!"); document.getElementById('taskInp').value = "";
    }

    async function copyReport(sid, e) {
        e.stopPropagation(); const snap = await db.ref('students/'+sid).once('value'); const data = snap.val();
        if(!data) return alert("Боргів немає!");
        let t = `📢 *БОРГИ: ${students[sid].name}*\n\n`;
        for(let s in data) { t += `📚 *${s}:*\n`; for(let c in data[s]) { for(let id in data[s][c]) t += ` • ${data[s][c][id].val} (${data[s][c][id].date})\n`; } t += `\n`; }
        navigator.clipboard.writeText(t).then(() => alert("Звіт скопійовано!"));
    }

    function savePlans() {
        let p = {};
        for(let s in structure) { p[s] = {}; structure[s].forEach(c => { p[s][c] = document.getElementById('p_'+s+'_'+c).value || 0; }); }
        db.ref('plans_v2').set(p).then(() => alert("Збережено!"));
    }
    function loadPlans() {
        db.ref('plans_v2').once('value', snap => {
            const d = snap.val() || {};
            for(let s in structure) structure[s].forEach(c => { 
                const el = document.getElementById('p_'+s+'_'+c);
                if(el && d[s]) el.value = d[s][c] || 0; 
            });
        });
    }
</script>
</body>
</html>
